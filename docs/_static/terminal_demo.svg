<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520">
  <defs>
    <clipPath id="clip1">
      <rect x="0" y="-20" height="30" width="0">
        <animate attributeName="width" from="0" to="200" dur="0.7s" begin="0.5s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
    <clipPath id="clip2">
      <rect x="0" y="-20" height="30" width="0">
        <animate attributeName="width" from="0" to="400" dur="1.0s" begin="2.0s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
    <clipPath id="clip3">
      <rect x="0" y="-20" height="30" width="0">
        <animate attributeName="width" from="0" to="480" dur="1.1s" begin="3.6s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
    <clipPath id="clip4">
      <rect x="0" y="-20" height="30" width="0">
        <animate attributeName="width" from="0" to="340" dur="0.9s" begin="5.8s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
    <clipPath id="clip9">
      <rect x="0" y="-20" height="30" width="0">
        <animate attributeName="width" from="0" to="520" dur="1.5s" begin="11.5s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
    <clipPath id="clip14">
      <rect x="0" y="-20" height="30" width="0">
        <animate attributeName="width" from="0" to="400" dur="1.0s" begin="17.0s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    text { font: 14px "SF Mono","Fira Code","Cascadia Code","Menlo",monospace; }
    .title   { fill: #565f89; font-size: 12px; }
    .prompt  { fill: #7aa2f7; }
    .cmd     { fill: #c0caf5; }
    .comment { fill: #565f89; font-style: italic; }
    .output  { fill: #787c99; }
    .hilite  { fill: #9ece6a; }
    .flag    { fill: #bb9af7; }
    .ch      { fill: #9ece6a; }
    .cl      { fill: #7aa2f7; }
    .cn      { fill: #e0af68; }
    .cN      { fill: #565f89; }
    @keyframes fi { to { opacity: 1 } }
  </style>

  <!-- Window frame -->
  <rect fill="#1a1b26" width="720" height="520" rx="10"/>
  <rect fill="#24283b" width="720" height="38" rx="10"/>
  <rect fill="#24283b" width="720" height="10" y="28"/>
  <circle fill="#f7768e" cx="20" cy="22" r="6"/>
  <circle fill="#e0af68" cx="38" cy="22" r="6"/>
  <circle fill="#9ece6a" cx="56" cy="22" r="6"/>
  <text class="title" x="320" y="25" text-anchor="middle">ancify &#x2014; decode the root</text>

  <g transform="translate(20,60)">

    <!-- Line 1: pip install -->
    <text class="prompt" y="0">$</text>
    <g clip-path="url(#clip1)">
      <text class="cmd" x="16" y="0">pip install .</text>
    </g>

    <!-- Line 2: ancify init -->
    <text class="prompt" y="26" opacity="0"><animate attributeName="opacity" to="1" dur="0.01s" begin="1.8s" fill="freeze"/>$</text>
    <g clip-path="url(#clip2)">
      <text class="cmd" x="16" y="26">ancify init <tspan class="flag">-o</tspan> config.yaml</text>
    </g>

    <!-- Line 3: edit config (comment) -->
    <text class="prompt" y="52" opacity="0"><animate attributeName="opacity" to="1" dur="0.01s" begin="3.4s" fill="freeze"/>$</text>
    <g clip-path="url(#clip3)">
      <text class="comment" x="16" y="52"># edit config.yaml: species, alignments, output_dir</text>
    </g>

    <!-- Line 4: ancify run -->
    <text class="prompt" y="78" opacity="0"><animate attributeName="opacity" to="1" dur="0.01s" begin="5.6s" fill="freeze"/>$</text>
    <g clip-path="url(#clip4)">
      <text class="cmd" x="16" y="78">ancify run <tspan class="flag">-c</tspan> config.yaml</text>
    </g>

    <!-- Phase 1 output -->
    <g opacity="0" style="animation:fi .3s ease 7.2s forwards">
      <text class="output" y="114">Phase 1: projecting 4 outgroups &#xd7; 23 chromosomes...</text>
    </g>
    <g opacity="0" style="animation:fi .3s ease 7.9s forwards">
      <text class="output" y="134">  &#x2713; bonobo    &#x2713; chimp    &#x2713; gorilla    &#x2713; macaque</text>
    </g>

    <!-- Phase 2 output -->
    <g opacity="0" style="animation:fi .3s ease 8.6s forwards">
      <text class="output" y="164">Phase 2: calling ancestral alleles...</text>
    </g>
    <g opacity="0" style="animation:fi .3s ease 9.3s forwards">
      <text class="hilite" y="184">Done. Output: ./ancestral_calls/</text>
    </g>

    <!-- Confidence legend -->
    <g opacity="0" style="animation:fi .3s ease 10.0s forwards">
      <text class="output" y="224">Confidence encoding:</text>
      <text class="ch" y="244">  ACGT</text><text class="output" x="70" y="244">high &#x2014; both tiers agree</text>
      <text class="cl" y="264">  acgt</text><text class="output" x="70" y="264">low  &#x2014; one tier only</text>
      <text class="cn" y="284">  n</text><text class="output" x="70" y="284">unresolved &#x2014; tiers disagree</text>
      <text class="cN" y="304">  N</text><text class="output" x="70" y="304">missing &#x2014; no outgroup data</text>
    </g>

    <!-- head command -->
    <text class="prompt" y="344" opacity="0"><animate attributeName="opacity" to="1" dur="0.01s" begin="11.3s" fill="freeze"/>$</text>
    <g clip-path="url(#clip9)">
      <text class="cmd" x="16" y="344">head <tspan class="flag">-c</tspan> 60 ancestral_calls/chr22.fa</text>
    </g>

    <!-- FASTA output -->
    <g opacity="0" style="animation:fi .3s ease 13.5s forwards">
      <text class="output" y="374">&#x3e;chr22</text>
    </g>
    <g opacity="0" style="animation:fi .3s ease 14.2s forwards">
      <text y="394"><tspan class="ch">ACGTACGT</tspan><tspan class="cl">acgt</tspan><tspan class="ch">ACGT</tspan><tspan class="cN">NNNN</tspan><tspan class="ch">ACGT</tspan><tspan class="cl">acgt</tspan><tspan class="ch">ACGT</tspan><tspan class="cn">n</tspan><tspan class="ch">ACGT</tspan></text>
    </g>

    <!-- Stats -->
    <g opacity="0" style="animation:fi .3s ease 15.2s forwards">
      <text class="output" y="434">chr22:  <tspan class="ch">74.6%</tspan> high   <tspan class="cl">15.8%</tspan> low   <tspan class="cn">0.1%</tspan> unresolved   <tspan class="cN">9.5%</tspan> missing</text>
    </g>

    <!-- Final comment -->
    <text class="prompt" y="460" opacity="0"><animate attributeName="opacity" to="1" dur="0.01s" begin="16.8s" fill="freeze"/>$</text>
    <g clip-path="url(#clip14)">
      <text class="comment" x="16" y="460"># ancestral alleles, decoded.</text>
    </g>

  </g>
</svg>
