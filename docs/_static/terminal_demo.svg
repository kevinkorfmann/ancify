<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520">
  <defs>
    <clipPath id="clip1">
      <rect x="0" y="-20" height="30" width="0">
        <animate attributeName="width" from="0" to="200" dur="0.7s" begin="0.5s" fill="freeze" calcMode="linear" />
      </rect>
    </clipPath>
    <clipPath id="clip2">
      <rect x="0" y="-20" height="30" width="0">
        <animate attributeName="width" from="0" to="400" dur="1.0s" begin="2.0s" fill="freeze" calcMode="linear" />
      </rect>
    </clipPath>
    <clipPath id="clip3">
      <rect x="0" y="-20" height="30" width="0">
        <animate attributeName="width" from="0" to="340" dur="0.9s" begin="4.5s" fill="freeze" calcMode="linear" />
      </rect>
    </clipPath>
    <clipPath id="clip9">
      <rect x="0" y="-20" height="30" width="0">
        <animate attributeName="width" from="0" to="520" dur="1.5s" begin="10.0s" fill="freeze" calcMode="linear" />
      </rect>
    </clipPath>
    <clipPath id="clip14">
      <rect x="0" y="-20" height="30" width="0">
        <animate attributeName="width" from="0" to="400" dur="1.0s" begin="15.5s" fill="freeze" calcMode="linear" />
      </rect>
    </clipPath>
  </defs>

  <style>
    text { font: 14px "SF Mono","Fira Code","Cascadia Code","Menlo",monospace; }
    .title   { fill: #565f89; font-size: 12px; }
    .prompt  { fill: #7aa2f7; }
    .cmd     { fill: #c0caf5; }
    .comment { fill: #565f89; font-style: italic; }
    .output  { fill: #787c99; }
    .hilite  { fill: #9ece6a; }
    .flag    { fill: #bb9af7; }
    .ch      { fill: #9ece6a; }
    .cl      { fill: #7aa2f7; }
    .cn      { fill: #e0af68; }
    .cN      { fill: #565f89; }
    @keyframes fi { to { opacity: 1 } }
  </style>

  <!-- Window frame -->
  <rect fill="#1a1b26" width="720" height="520" rx="10"/>
  <rect fill="#24283b" width="720" height="38" rx="10"/>
  <rect fill="#24283b" width="720" height="10" y="28"/>
  <circle fill="#f7768e" cx="20" cy="22" r="6"/>
  <circle fill="#e0af68" cx="38" cy="22" r="6"/>
  <circle fill="#9ece6a" cx="56" cy="22" r="6"/>
  <text class="title" x="320" y="25" text-anchor="middle">ancify &#x2014; decode the root</text>

  <g transform="translate(20,60)">

    <!-- === Line 1: pip install === -->
    <text class="prompt" y="0">$</text>
    <g clip-path="url(#clip1)">
      <text class="cmd" x="16" y="0">pip install .</text>
    </g>

    <!-- === Line 2: ancify init (prompt hidden until 1.8s) === -->
    <text class="prompt" y="30" opacity="0"><animate attributeName="opacity" to="1" dur="0.01s" begin="1.8s" fill="freeze"/>$</text>
    <g clip-path="url(#clip2)">
      <text class="cmd" x="16" y="30">ancify init <tspan class="flag">-o</tspan> config.yaml</text>
    </g>

    <!-- === Line 3: ancify run (prompt hidden until 4.3s) === -->
    <text class="prompt" y="60" opacity="0"><animate attributeName="opacity" to="1" dur="0.01s" begin="4.3s" fill="freeze"/>$</text>
    <g clip-path="url(#clip3)">
      <text class="cmd" x="16" y="60">ancify run <tspan class="flag">-c</tspan> config.yaml</text>
    </g>

    <!-- === Phase 1 output === -->
    <g opacity="0" style="animation:fi .3s ease 5.8s forwards">
      <text class="output" y="100">Phase 1: projecting 4 outgroups &#xd7; 23 chromosomes...</text>
    </g>
    <g opacity="0" style="animation:fi .3s ease 6.5s forwards">
      <text class="output" y="120">  &#x2713; bonobo    &#x2713; chimp    &#x2713; gorilla    &#x2713; macaque</text>
    </g>

    <!-- === Phase 2 output === -->
    <g opacity="0" style="animation:fi .3s ease 7.2s forwards">
      <text class="output" y="150">Phase 2: calling ancestral alleles...</text>
    </g>
    <g opacity="0" style="animation:fi .3s ease 8.0s forwards">
      <text class="hilite" y="170">Done. Output: ./ancestral_calls/</text>
    </g>

    <!-- === Confidence legend === -->
    <g opacity="0" style="animation:fi .3s ease 9.0s forwards">
      <text class="output" y="210">Confidence encoding:</text>
      <text class="ch" y="230">  ACGT</text><text class="output" x="70" y="230">high &#x2014; both tiers agree</text>
      <text class="cl" y="250">  acgt</text><text class="output" x="70" y="250">low  &#x2014; one tier only</text>
      <text class="cn" y="270">  n</text><text class="output" x="70" y="270">unresolved &#x2014; tiers disagree</text>
      <text class="cN" y="290">  N</text><text class="output" x="70" y="290">missing &#x2014; no outgroup data</text>
    </g>

    <!-- === Line 9: head command (prompt hidden until 9.8s) === -->
    <text class="prompt" y="330" opacity="0"><animate attributeName="opacity" to="1" dur="0.01s" begin="9.8s" fill="freeze"/>$</text>
    <g clip-path="url(#clip9)">
      <text class="cmd" x="16" y="330">head <tspan class="flag">-c</tspan> 60 ancestral_calls/chr22.fa</text>
    </g>

    <!-- === FASTA output === -->
    <g opacity="0" style="animation:fi .3s ease 12.0s forwards">
      <text class="output" y="360">&#x3e;chr22</text>
    </g>
    <g opacity="0" style="animation:fi .3s ease 12.8s forwards">
      <text y="380"><tspan class="ch">ACGTACGT</tspan><tspan class="cl">acgt</tspan><tspan class="ch">ACGT</tspan><tspan class="cN">NNNN</tspan><tspan class="ch">ACGT</tspan><tspan class="cl">acgt</tspan><tspan class="ch">ACGT</tspan><tspan class="cn">n</tspan><tspan class="ch">ACGT</tspan></text>
    </g>

    <!-- === Stats === -->
    <g opacity="0" style="animation:fi .3s ease 14.0s forwards">
      <text class="output" y="420">chr22:  <tspan class="ch">74.6%</tspan> high   <tspan class="cl">15.8%</tspan> low   <tspan class="cn">0.1%</tspan> unresolved   <tspan class="cN">9.5%</tspan> missing</text>
    </g>

    <!-- === Final comment (prompt hidden until 15.3s) === -->
    <text class="prompt" y="450" opacity="0"><animate attributeName="opacity" to="1" dur="0.01s" begin="15.3s" fill="freeze"/>$</text>
    <g clip-path="url(#clip14)">
      <text class="comment" x="16" y="450"># ancestral alleles, decoded.</text>
    </g>

  </g>
</svg>
