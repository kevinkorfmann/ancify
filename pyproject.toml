[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ancify"
version = "1.0.0"
description = "Ancestral allele polarization pipeline using outgroup species"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=5.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
evaluate = ["scikit-allel>=1.3", "matplotlib>=3.0"]
all = ["scikit-allel>=1.3", "matplotlib>=3.0"]

[project.scripts]
ancify = "ancify.cli:main"

[tool.setuptools.packages.find]
include = ["ancify*"]
