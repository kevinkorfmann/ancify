[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ancify"
version = "1.0.0"
description = "Ancestral allele polarization pipeline using outgroup species"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=5.0",
    "numpy>=1.20",
    "lightgbm>=4.6.0",
]

[project.optional-dependencies]
fast = ["isal>=1.0"]
evaluate = ["scikit-allel>=1.3", "matplotlib>=3.0"]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=1.25",
    "myst-parser>=2.0",
]
ml = ["lightgbm>=4.0", "scikit-learn>=1.0"]
dev = ["pytest>=7.0"]
all = ["isal>=1.0", "scikit-allel>=1.3", "matplotlib>=3.0", "lightgbm>=4.0", "scikit-learn>=1.0", "pytest>=7.0"]

[project.scripts]
ancify = "ancify.cli:main"

[tool.setuptools.packages.find]
include = ["ancify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
